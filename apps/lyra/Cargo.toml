[package]
name = "nyx-lyra"
version = "0.1.0"
description = "YouTube Music for NyxOS, in GTK4 and Nyx Design 2.0"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-lyra"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68", default-features = false }
nyx-lyra-core = { path = "../../crates/nyx-lyra-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ea8839d237a23ec83887429475f0780c06a36826" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ea8839d237a23ec83887429475f0780c06a36826" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ureq = "3"
async-channel = "2"
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde_json = "1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }
zbus = "5"
