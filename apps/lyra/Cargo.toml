[package]
name = "nyx-lyra"
version = "0.1.0"
description = "YouTube Music for NyxOS, in GTK4 and Nyx Design 2.0"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-lyra"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "918729504918ec344b3a853a5ce0ea2c9dbb7b5f", default-features = false }
nyx-lyra-core = { path = "../../crates/nyx-lyra-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "9571719f23fc66e9f4e244bd52bb97f2977efc37" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "9571719f23fc66e9f4e244bd52bb97f2977efc37" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ureq = "3"
async-channel = "2"
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde_json = "1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }
zbus = "5"
