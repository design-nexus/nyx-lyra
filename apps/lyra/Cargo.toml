[package]
name = "nyx-lyra"
version = "0.1.0"
description = "YouTube Music for NyxOS, in GTK4 and Nyx Design 2.0"
license.workspace = true
repository.workspace = true
authors.workspace = true
edition.workspace = true

[[bin]]
name = "nyx-lyra"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89" }
nyx-actions = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89", default-features = false }
nyx-lyra-core = { path = "../../crates/nyx-lyra-core" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8b41fb14ec11fa18199d8f4228d267d94dc8e323" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "8b41fb14ec11fa18199d8f4228d267d94dc8e323" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
ureq = "3"
async-channel = "2"
glib = "0.22"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde_json = "1"
webkit6 = { version = "0.6.1", features = ["v2_50"] }
zbus = "5"
